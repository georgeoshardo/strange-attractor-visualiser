<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<style>
html,
body,
#root {
  margin: 0;
  padding: 0;
  width: 100%;
  background: transparent !important;
  color: #eeeeee;
  font-family: "Courier New", monospace;
}

.slider-wrap {
  display: grid;
  grid-template-columns: auto auto;
  grid-template-rows: auto auto auto;
  align-items: center;
  justify-content: center;
  column-gap: 0.35rem;
  background: transparent;
}

.value {
  grid-column: 1 / 3;
  text-align: center;
  color: #eeeeee;
  line-height: 1.2;
}

.range-box {
  position: relative;
  display: flex;
  align-items: center;
  justify-content: center;
  box-sizing: border-box;
}

input[type="range"] {
  position: absolute;
  appearance: none;
  -webkit-appearance: none;
  background: transparent;
  margin: 0;
  cursor: pointer;
  transform: rotate(-90deg);
}

input[type="range"]::-webkit-slider-runnable-track {
  height: var(--slider-width);
  border: 0;
  background: var(--track-color);
}

input[type="range"]::-webkit-slider-thumb {
  appearance: none;
  -webkit-appearance: none;
  width: var(--slider-width);
  height: 0.75rem;
  margin-top: calc((var(--slider-width) - 0.75rem) / 2);
  border: 0;
  border-radius: var(--thumb-radius);
  background: var(--thumb-color);
}

input[type="range"]::-moz-range-track {
  height: var(--slider-width);
  border: 0;
  background: var(--track-color);
}

input[type="range"]::-moz-range-progress {
  height: var(--slider-width);
  border: 0;
  background: var(--fill-color);
}

input[type="range"]::-moz-range-thumb {
  width: var(--slider-width);
  height: 0.75rem;
  border: 0;
  border-radius: var(--thumb-radius);
  background: var(--thumb-color);
}

.marks {
  align-self: stretch;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  color: #888888;
  line-height: 1;
}

.mark {
  display: flex;
  align-items: center;
  gap: 0.25rem;
  white-space: nowrap;
}

.mark::before {
  content: "";
  width: 1.1rem;
  height: 1px;
  background: #888888;
  display: inline-block;
}

.min-label,
.param-label {
  grid-column: 1 / 3;
  text-align: center;
  color: #eeeeee;
  line-height: 1.2;
}
</style>
</head>
<body>
<div id="root"></div>
<script>
function send(type, data) {
  try {
    var msg = { isStreamlitMessage: true, type: type };
    if (data) {
      for (var key in data) msg[key] = data[key];
    }
    window.parent.postMessage(msg, "*");
  } catch (e) {}
}

var Streamlit = {
  setComponentValue: function(value) {
    send("streamlit:setComponentValue", { value: value, dataType: "json" });
  },
  setFrameHeight: function(height) {
    send("streamlit:setFrameHeight", { height: height });
  },
  setComponentReady: function() {
    send("streamlit:componentReady", { apiVersion: 1 });
  }
};

var args = {};
var currentValue = null;
var pendingValue = null;
var animationFrame = null;

function numberArg(name, fallback) {
  var value = Number(args[name]);
  return Number.isFinite(value) ? value : fallback;
}

function rounded(value) {
  var step = numberArg("step", 1);
  var decimals = 0;
  var text = String(step);
  if (text.indexOf("e-") >= 0) {
    decimals = Number(text.split("e-")[1]);
  } else if (text.indexOf(".") >= 0) {
    decimals = text.split(".")[1].length;
  }
  return Number(value).toFixed(Math.min(decimals, 6));
}

function displayValue(value) {
  var numeric = Number(value);
  if (!Number.isFinite(numeric)) return String(value);
  return numeric.toFixed(2);
}

function cleanLabel(label) {
  return label ? String(label).replace(/\$/g, "") : "";
}

function emitValue(value) {
  pendingValue = Number(value);
  if (animationFrame !== null) return;

  animationFrame = requestAnimationFrame(function() {
    animationFrame = null;
    Streamlit.setComponentValue(pendingValue);
  });
}

function makeMarks(minValue, maxValue) {
  if (!args.show_marks) return "";

  var count = 6;
  var marks = [];
  for (var i = count - 1; i >= 0; i--) {
    var value = minValue + ((maxValue - minValue) * i) / (count - 1);
    marks.push('<span class="mark">' + displayValue(value) + "</span>");
  }
  return '<div class="marks">' + marks.join("") + "</div>";
}

function render() {
  var root = document.getElementById("root");
  var minValue = numberArg("min_value", 0);
  var maxValue = numberArg("max_value", 10);
  var step = numberArg("step", 1);
  var height = Math.max(40, numberArg("height", 200));
  var width = Math.max(8, numberArg("width", 20));
  var defaultValue = numberArg("default_value", minValue);
  currentValue = currentValue === null ? defaultValue : currentValue;

  var borderWidth = Math.max(0, numberArg("slider_border_width", 0));
  var valueFontSize = Math.max(8, numberArg("value_font_size", 14));
  var markFontSize = Math.max(8, numberArg("mark_font_size", 9));
  var thumbShape = args.thumb_shape || "circle";
  var thumbRadius = thumbShape === "square" ? "1px" : thumbShape === "pill" ? "0.25rem" : "999px";
  var trackColor = args.track_color || "#E5E9F1";
  var fillColor = args.slider_color || "#FF4B4B";
  var thumbColor = args.thumb_color || "#FF4B4B";
  var borderColor = args.slider_border_color || "#555555";

  root.innerHTML = [
    '<div class="slider-wrap">',
    '<span class="value" style="font-size:' + valueFontSize + 'px">' + displayValue(currentValue) + "</span>",
    '<div class="range-box" style="width:' + (width + 2 * borderWidth) + 'px;height:' + (height + 2 * borderWidth) + 'px;border:' + borderWidth + 'px solid ' + borderColor + '">',
    '<input id="slider" type="range" min="' + minValue + '" max="' + maxValue + '" step="' + step + '" value="' + currentValue + '"',
    ' style="--slider-width:' + width + 'px;--track-color:' + trackColor + ';--fill-color:' + fillColor + ';--thumb-color:' + thumbColor + ';--thumb-radius:' + thumbRadius + ';width:' + height + 'px;">',
    "</div>",
    makeMarks(minValue, maxValue).replace('class="marks"', 'class="marks" style="height:' + height + 'px;font-size:' + markFontSize + 'px"'),
    '<span class="min-label" style="font-size:' + valueFontSize + 'px">' + displayValue(minValue).replace(".00", "") + "</span>",
    '<span class="param-label" style="font-size:' + valueFontSize + 'px">' + cleanLabel(args.label) + "</span>",
    "</div>"
  ].join("");

  var slider = document.getElementById("slider");
  slider.addEventListener("input", function(event) {
    currentValue = Number(event.target.value);
    document.querySelector(".value").textContent = displayValue(currentValue);
    emitValue(rounded(currentValue));
  });

  slider.addEventListener("change", function(event) {
    currentValue = Number(event.target.value);
    Streamlit.setComponentValue(Number(rounded(currentValue)));
  });

  Streamlit.setFrameHeight(height + 64);
}

window.addEventListener("message", function(event) {
  if (event.data.type !== "streamlit:render") return;

  var renderArgs = event.data.args;
  if (!renderArgs && event.data.data) renderArgs = event.data.data.args;
  if (!renderArgs) return;

  args = renderArgs;
  currentValue = numberArg("default_value", numberArg("min_value", 0));
  render();
});

Streamlit.setComponentReady();
</script>
</body>
</html>
